document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

amily: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"e32226c9-6689-40e3-ba7d-fe26cc012f5e\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"6e383e97-dcd3-422d-864c-684a1cbfde91\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"e4bb82b3-e28b-4062-8313-e200fac3bc3d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"a6411203-7f0d-4794-9ee6-08ec9d1adfec\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   GMH — Color tokens\n   Bold, flat, saturated background colors carrying white or black type —\n   a museum-wall-didactic palette, not a UI palette. Five backgrounds only:\n   magenta, red, blue, black, white. No gradients, no tints, no shadows.\n   ========================================================================== */\n\n:root {\n  /* ---- Base hues (the only five backgrounds in this system) ------------ */\n  --gmh-magenta: #E5057F;\n  --gmh-red:     #E2211C;\n  --gmh-blue:    #1230E0;\n  --gmh-black:   #0A0A0A;\n  --gmh-white:   #FFFFFF;\n\n  /* ---- Supporting neutrals (never a background; hairlines + muted text only) */\n  --gmh-paper:      #F7F5F1;   /* warm off-white, used only for photo mattes / captions strips */\n  --gmh-ink-70:     rgba(10, 10, 10, 0.72);\n  --gmh-ink-45:     rgba(10, 10, 10, 0.45);\n  --gmh-paper-70:   rgba(255, 255, 255, 0.72);\n  --gmh-paper-45:   rgba(255, 255, 255, 0.45);\n\n  /* ---- Semantic: surfaces (the five approved section/page backgrounds) - */\n  --surface-magenta: var(--gmh-magenta);\n  --surface-red:      var(--gmh-red);\n  --surface-blue:      var(--gmh-blue);\n  --surface-black:    var(--gmh-black);\n  --surface-white:    var(--gmh-white);\n\n  /* ---- Semantic: text-on-color (only white or black type, ever) -------- */\n  --text-on-dark:        var(--gmh-white);\n  --text-on-dark-muted:  var(--gmh-paper-70);\n  --text-on-dark-faint:  var(--gmh-paper-45);\n\n  --text-on-light:       var(--gmh-black);\n  --text-on-light-muted: var(--gmh-ink-70);\n  --text-on-light-faint: var(--gmh-ink-45);\n\n  /* ---- Semantic: hairlines / dividers ----------------------------------- */\n  --hairline-on-dark:  rgba(255, 255, 255, 0.28);\n  --hairline-on-light: rgba(10, 10, 10, 0.16);\n\n  /* ---- Focus / interactive (kept minimal — editorial system, not app UI) */\n  --link-on-light: var(--gmh-black);\n  --link-on-light-hover: var(--gmh-red);\n  --link-on-dark: var(--gmh-white);\n  --link-on-dark-hover: var(--gmh-paper-70);\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   GMH — Type tokens\n   Rafaella (sub: Yeseva One) — display serif, chapter/decade titles, ALL CAPS.\n   Univia Pro (sub: Manrope) — geometric text sans, reading body + labels.\n   Discrete properties (not CSS `font` shorthand) so each is easy to read,\n   override, and doesn't trip shorthand-family parsing.\n   ========================================================================== */\n\n:root {\n  /* ---- Families ---------------------------------------------------------*/\n  --font-display: 'Fraunces', 'Rafaella', Georgia, 'Times New Roman', serif;\n  --font-body:    'Manrope', 'Univia Pro', -apple-system, 'Segoe UI', sans-serif;\n\n  /* ---- Display scale (Rafaella) — decade numerals, chapter titles ------- */\n  --size-display-2xl: clamp(4.5rem, 4rem + 4vw, 9rem);     /* decade numerals, book cover */\n  --size-display-xl:  clamp(3rem, 2.6rem + 2.6vw, 5.5rem); /* chapter title */\n  --size-display-lg:  clamp(2rem, 1.8rem + 1.2vw, 3rem);   /* spread title */\n  --size-display-md:  clamp(1.5rem, 1.4rem + 0.5vw, 1.875rem); /* pull-quote */\n  --leading-display-tight: 0.94;\n  --leading-display: 1.02;\n  --weight-display: 400;\n\n  /* ---- Body scale (Univia Pro) — reading, captions, UI chrome ----------- */\n  --size-body-lg:  1.375rem;  /* lede paragraph / drop-cap body */\n  --size-body:     1.125rem;  /* default reading */\n  --size-body-sm:  1rem;      /* dense text */\n  --size-caption:  0.8125rem; /* photo credits */\n  --size-label:    0.75rem;   /* era tags, folios — always uppercase + tracked */\n  --leading-body: 1.65;\n  --leading-body-tight: 1.5;\n  --weight-body-regular: 400;\n  --weight-body-medium: 500;\n  --weight-body-bold: 700;\n  --weight-body-black: 800;\n\n  /* ---- Tracking (letter-spacing) ---------------------------------------- */\n  --tracking-display: 0.01em;\n  --tracking-label:   0.14em;\n  --tracking-caption: 0.02em;\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   GMH — Spacing, radius & layout tokens\n   Editorial rhythm: generous whitespace, flat geometry. Radii are ~0 —\n   this is a museum-wall aesthetic, not a soft-UI one.\n   ========================================================================== */\n\n:root {\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n  --space-11: 192px;\n\n  /* Page margins — book-spread feel at common preview widths */\n  --page-margin: clamp(24px, 6vw, 96px);\n  --page-margin-sm: clamp(16px, 4vw, 48px);\n\n  /* Radii — intentionally near-zero. Only the small era-tag pill softens. */\n  --radius-0: 0px;\n  --radius-tag: 2px;\n\n  /* Hairline weight */\n  --rule-weight: 1px;\n  --rule-weight-bold: 3px;\n}\n<\u002Fstyle>\n  <style>/* GMH Book Design System — global stylesheet entry point.\n   List-of-imports only; no rules live here. */\n/* ==========================================================================\n   GMH — Web font loading\n   Brand fonts specified: \"Rafaella\" (title) + \"Univia Pro\" (text). Both are\n   paid/commercial faces (Sproviero Type / Mostardesign — Adobe Fonts & MyFonts\n   only) with no files supplied to this project. Substituted with the closest\n   free Google Fonts matches below — see readme.md \"Typography\" for the\n   substitution rationale. Swap these two @import families for the real\n   webfont files the moment they're available; every other token references\n   the family by CSS variable, so no other file needs to change.\n   ========================================================================== */\n\n/* vietnamese */\n@font-face {\n  font-family: 'Fraunces';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d9bab5e1-fb98-463a-8c89-5ce44e71a6ba\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Fraunces';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"76a3cb0a-27af-4753-b147-283f72d5ceda\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, play serif, chapter/decade titles, ALL CAPS.\n   Univia Pro (sub: Manrope) — geometric text sans, reading body + labels.\n   Discrete properties (not CSS `font` shorthand) so each is easy to read,\n   override, and doesn't trip shorthand-family parsing.\n   ========================================================================== */\n\n:root {\n  /* ---- Families ---------------------------------------------------------*/\n  --font-display: 'Fraunces', 'Rafaella', Georgia, 'Times New Roman', serif;\n  --font-body:    'Manrope', 'Univia Pro', -apple-system, 'Segoe UI', sans-serif;\n\n  /* ---- Display scale (Rafaella) — decade numerals, chapter titles ------- */\n  --size-display-2xl: clamp(4.5rem, 4rem + 4vw, 9rem);     /* decade numerals, book cover */\n  --size-display-xl:  clamp(3rem, 2.6rem + 2.6vw, 5.5rem); /* chapter title */\n  --size-display-lg:  clamp(2rem, 1.8rem + 1.2vw, 3rem);   /* spread title */\n  --size-display-md:  clamp(1.5rem, 1.4rem + 0.5vw, 1.875rem); /* pull-quote */\n  --leading-display-tight: 0.94;\n  --leading-display: 1.02;\n  --weight-display: 400;\n\n  /* ---- Body scale (Univia Pro) — reading, captions, UI chrome ----------- */\n  --size-body-lg:  1.375rem;  /* lede paragraph / drop-cap body */\n  --size-body:     1.125rem;  /* default reading */\n  --size-body-sm:  1rem;      /* dense text */\n  --size-caption:  0.8125rem; /* photo credits */\n  --size-label:    0.75rem;   /* era tags, folios — always uppercase + tracked */\n  --leading-body: 1.65;\n  --leading-body-tight: 1.5;\n  --weight-body-regular: 400;\n  --weight-body-medium: 500;\n  --weight-body-bold: 700;\n  --weight-body-black: 800;\n\n  /* ---- Tracking (letter-spacing) ---------------------------------------- */\n  --tracking-display: 0.01em;\n  --tracking-label:   0.14em;\n  --tracking-caption: 0.02em;\n}\n\n/* ==========================================================================\n   GMH — Spacing, radius & layout tokens\n   Editorial rhythm: generous whitespace, fla  Component extends DCLogic {\n  state = {\n    isMobile: false, menuOpen: false, cartOpen: false, cartItems: [],\n    checkoutOpen: false, checkoutStep: 'shipping', orderPlaced: false, orderNumber: '', checkoutLoading: false, checkoutError: '', shippingError: '',\n    shipEmail: '', shipName: '', shipAddress: '', shipCity: '', shipZip: '', shipCountry: '', shipPhone: '',\n    shippingMethod: 'standard',\n    paymentMethod: 'card',\n    cardNumber: '', cardExpiry: '', cardCvv: '', cardName: '',\n    billingSame: true, billAddress: '', billCity: '', billZip: '', billCountry: '',\n    couponCode: '', couponApplied: null, couponError: '',\n    bookImageIndex: 0,\n    newsletterEmail: '', newsletterStatus: 'idle', newsletterMessage: '',\n  };\n  bookImagesData = [\n    { id: 'book-image-1', src: 'uploads/cover2.png', caption: 'Gay Men History — hardcover.' },\n    { id: 'book-image-2', src: 'uploads/33.jpg', caption: 'Egypt — Same sex and human behaviors, 3500BC–1000BC.' },\n    { id: 'book-image-3', src: 'uploads/44.jpg', caption: 'Neoclassicism & Romanticism, 1760–1860.' },\n    { id: 'book-image-4', src: 'uploads/55.jpg', caption: 'Baroque & Rococo, 1600–1750.' },\n    { id: 'book-image-5', src: 'uploads/66.jpg', caption: 'Berlin, 1900–1940.' },\n  ];\n  componentDidMount() {\n    this.checkSize = () => this.setState({ isMobile: window.innerWidth <= 768 });\n    this.checkSize();\n    window.addEventListener('resize', this.checkSize);\n    var params = new URLSearchParams(window.location.search);\n    if (params.get('order') === 'success') {\n      var sessionId = params.get('session_id') || '';\n      var orderNumber = 'GMH-' + sessionId.replace(/[^a-zA-Z0-9]/g, '').slice(-8).toUpperCase();\n      this.setState({ orderPlaced: true, orderNumber: orderNumber, cartItems: [], checkoutOpen: true, checkoutStep: 'review' });\n      window.history.replaceState({}, '', window.location.pathname);\n    } else if (params.get('order') === 'cancelled') {\n      window.history.replaceState({}, '', window.location.pathname);\n    }\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.checkSize);\n  }\n  prevBookImage() {\n    this.setState(s => ({ bookImageIndex: (s.bookImageIndex - 1 + this.bookImagesData.length) % this.bookImagesData.length }));\n  }\n  nextBookImage() {\n    this.setState(s => ({ bookImageIndex: (s.bookImageIndex + 1) % this.bookImagesData.length }));\n  }\n  addToCart(product) {\n    this.setState(s => {\n      const exists = s.cartItems.some(i => i.id === product.id);\n      const cartItems = exists\n        ? s.cartItems.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i)\n        : [...s.cartItems, { ...product, qty: 1 }];\n      return { cartItems, cartOpen: true, menuOpen: false };\n    });\n  }\n  incQty(id) {\n    this.setState(s => ({ cartItems: s.cartItems.map(i => i.id === id ? { ...i, qty: i.qty + 1 } : i) }));\n  }\n  decQty(id) {\n    this.setState(s => ({ cartItems: s.cartItems.map(i => i.id === id ? { ...i, qty: i.qty - 1 } : i).filter(i => i.qty > 0) }));\n  }\n  removeItem(id) {\n    this.setState(s => ({ cartItems: s.cartItems.filter(i => i.id !== id) }));\n  }\n  field(key) {\n    return (e) => this.setState({ [key]: e.target.value });\n  }\n  openCheckout() {\n    this.setState({ cartOpen: false, checkoutOpen: true, checkoutStep: 'review', orderPlaced: false });\n  }\n  closeCheckout() {\n    this.setState({ checkoutOpen: false });\n  }\n  continueToReview() {\n    var s = this.state;\n    var required = [s.shipEmail, s.shipName, s.shipAddress, s.shipCity, s.shipZip, s.shipCountry];\n    var missing = required.some(function(v) { return !v || !v.trim(); });\n    var emailOk = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test((s.shipEmail || '').trim());\n    if (missing || !emailOk) {\n      this.setState({ shippingError: missing ? 'Please fill in all fields (phone is optional).' : 'Please enter a valid email address.' });\n      return;\n    }\n    this.setState({ shippingError: '' });\n    this.goStep('review');\n  }\n  goStep(step) {\n    this.setState({ checkoutStep: step });\n  }\n  setPaymentMethod(method) {\n    this.setState({ paymentMethod: method });\n  }\n  toggleBillingSame() {\n    this.setState(s => ({ billingSame: !s.billingSame }));\n  }\n  applyCoupon() {\n    const code = this.state.couponCode.trim().toUpperCase();\n    if (!code) { this.setState({ couponError: 'Enter a code.', couponApplied: null }); return; }\n    if (code === 'GMH10') {\n      this.setState({ couponApplied: { code, pct: 0.10, label: '10% off' }, couponError: '' });\n    } else {\n      this.setState({ couponApplied: null, couponError: 'That code is not valid.' });\n    }\n  }\n  placeOrder() {\n    if (this.state.checkoutLoading) return;\n    const items = this.state.cartItems.map(function(i) { return { id: i.id, qty: i.qty }; });\n    this.setState({ checkoutLoading: true, checkoutError: '' });\n    var self = this;\n    fetch('/api/create-checkout-session', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ items: items, email: this.state.shipEmail }),\n    })\n      .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })\n      .then(function(result) {\n        if (result.ok && result.data && result.data.url) {\n          window.location.href = result.data.url;\n        } else {\n          self.setState({ checkoutLoading: false, checkoutError: (result.data && result.data.error) || 'Could not start checkout. Please try again.' });\n        }\n      })\n      .catch(function() {\n        self.setState({ checkoutLoading: false, checkoutError: 'Network error. Please try again.' });\n      });\n  }\n  setNewsletterEmail(e) {\n    this.setState({ newsletterEmail: e.target.value, newsletterStatus: 'idle', newsletterMessage: '' });\n  }\n  joinNewsletter() {\n    const email = (this.state.newsletterEmail || '').trim();\n    const at = email.indexOf('@');\n    const domain = at > 0 ? email.slice(at + 1) : '';\n    const dot = domain.indexOf('.');\n    const hasSpace = email.indexOf(' ') !== -1;\n    const valid = at > 0 && dot > 0 && dot < domain.length - 1 && !hasSpace;\n    if (!valid) {\n      this.setState({ newsletterStatus: 'error', newsletterMessage: 'Enter a valid email address.' });\n      return;\n    }\n    if (this.state.newsletterStatus === 'sending') return;\n    this.setState({ newsletterStatus: 'sending', newsletterMessage: '' });\n    fetch('/api/join', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ email: email }),\n    }).then((r) => {\n      return r.json().then((data) => ({ status: r.status, data: data }));\n    }).then((result) => {\n      if (result.status === 200 && result.data && result.data.success) {\n        this.setState({ newsletterStatus: 'success', newsletterMessage: 'Thanks. You are on the list.', newsletterEmail: '' });\n      } else {\n        const msg = (result.data && result.data.error) || 'Something went wrong. Please try again.';\n        this.setState({ newsletterStatus: 'error', newsletterMessage: msg });\n      }\n    }).catch(() => {\n      this.setState({ newsletterStatus: 'error', newsletterMessage: 'Network error. Please try again.' });\n    });\n  }\n  renderVals() {\n    const n = this.bookImagesData.length;\n    const bookImages = this.bookImagesData.map(img => ({ ...img, slideWrapStyle: `width:${100 / n}%;height:100%;flex-shrink:0;` }));\n    const bookTrackStyle = `display:flex;width:${n * 100}%;height:100%;transform:translateX(-${this.state.bookImageIndex * (100 / n)}%);transition:transform .5s cubic-bezier(0.65,0,0.35,1);`;\n    const cartItems = this.state.cartItems;\n    const cartCount = cartItems.reduce((n, i) => n + i.qty, 0);\n    const activeBookImageCaption = this.bookImagesData[this.state.bookImageIndex].caption;\n    const bookImageDots = this.bookImagesData.map((_, i) => ({\n      onClick: () => this.setState({ bookImageIndex: i }),\n      style: `width:8px;height:8px;padding:0;border-radius:50%;border:none;cursor:pointer;background:${i === this.state.bookImageIndex ? 'var(--surface-magenta)' : 'rgba(255,255,255,0.6)'};`,\n    }));\n    const cartSubtotal = cartItems.reduce((n, i) => n + i.qty * i.price, 0);\n    const cartItemsView = cartItems.map(i => ({\n      ...i,\n      isBook: i.id === 'book',\n      notBook: i.id !== 'book',\n      inc: () => this.incQty(i.id),\n      dec: () => this.decQty(i.id),\n      remove: () => this.removeItem(i.id),\n    }));\n    const shippingCost = SHIP_RATES[this.state.shippingMethod] ?? SHIP_RATES.standard;\n    const discountAmount = this.state.couponApplied ? +(cartSubtotal * this.state.couponApplied.pct).toFixed(2) : 0;\n    const taxAmount = +((cartSubtotal - discountAmount) * 0.08).toFixed(2);\n    const orderTotal = +(cartSubtotal - discountAmount + shippingCost).toFixed(2);\n    return {\n      isMobile: this.state.isMobile,\n      isDesktop: !this.state.isMobile,\n      bookImages,\n      bookTrackStyle,\n      activeBookImageCaption,\n      bookImageDots,\n      prevBookImage: () => this.prevBookImage(),\n      nextBookImage: () => this.nextBookImage(),\n      bookDetailGridStyle: `display:grid;grid-template-columns:${this.state.isMobile ? 'minmax(0,1fr)' : 'minmax(0,1fr) minmax(0,1fr)'};gap:var(--space-8);padding:0 var(--page-margin) var(--space-9);box-sizing:border-box;align-items:start;`,\n      aboutGridStyle: `display:grid;grid-template-columns:${this.state.isMobile ? 'minmax(0,1fr)' : 'minmax(0,1fr) minmax(0,1fr)'};gap:var(--space-8);padding:var(--space-9) var(--page-margin) 50px;box-sizing:border-box;align-items:start;`,\n      merchGridStyle: `display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-7);`,\n      menuOpen: this.state.menuOpen,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      cartOpen: this.state.cartOpen,\n      cartCount,\n      cartSubtotal,\n      cartItemsView,\n      cartHasItems: cartItems.length > 0,\n      cartIsEmpty: cartItems.length === 0,\n      openCart: () => this.setState({ cartOpen: true, menuOpen: false }),\n      closeCart: () => this.setState({ cartOpen: false }),\n      cartDrawerStyle: `position:fixed;top:0;right:0;height:100dvh;width:${this.state.isMobile ? '100%' : '420px'};max-width:100%;background:var(--surface-white);z-index:50;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.18);transform:translateX(${this.state.cartOpen ? '0' : '100%'});transition:transform .35s cubic-bezier(.4,0,.2,1);`,\n      addBook: () => this.addToCart(PRODUCTS.book),\n      addMug: () => this.addToCart(PRODUCTS.mug),\n      addPoster: () => this.addToCart(PRODUCTS.poster),\n      addCandle: () => this.addToCart(PRODUCTS.candle),\n      addTowel: () => this.addToCart(PRODUCTS.towel),\n      openCheckout: () => this.openCheckout(),\n      closeCheckout: () => this.closeCheckout(),\n      checkoutOpen: this.state.checkoutOpen,\n      checkoutOverlayStyle: `position:fixed;inset:0;z-index:60;background:var(--surface-white);display:flex;flex-direction:column;transform:translateX(${this.state.checkoutOpen ? '0' : '100%'});transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;`,\n      checkoutLayoutStyle: `display:grid;grid-template-columns:${this.state.isMobile ? '1fr' : 'minmax(0,1.4fr) minmax(320px,1fr)'};gap:var(--space-9);padding:var(--space-8) var(--page-margin);box-sizing:border-box;flex:1;align-items:start;`,\n      orderPlaced: this.state.orderPlaced,\n      orderNumber: this.state.orderNumber,\n\n      isStepShipping: this.state.checkoutStep === 'shipping',\n      isStepPayment: this.state.checkoutStep === 'payment',\n      isStepReview: this.state.checkoutStep === 'review' && !this.state.orderPlaced,\n      goShipping: () => this.goStep('shipping'),\n      goPayment: () => this.goStep('paym
